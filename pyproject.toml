[project]
name = "fermi-podcast-companion"
version = "1.0.0"
description = "A grounded conversational companion for long-form physics podcasts, built from raw audio."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.3",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.5",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "rich>=13.7.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[project.scripts]
companion = "companion.interface.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
