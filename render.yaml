# Render Blueprint — Fermi Podcast Companion
#
# Deploys the pre-built index as an immutable Docker image. There is no build
# step that runs ASR: `make ingest` is run once on a machine that has the
# audio, and data/index + data/chunks + data/manifest.json are committed.
#
# No persistent disk is declared, deliberately. Verified: the service never
# writes to data/ at runtime — the Chroma DB and BM25 index are read-only, and
# conversation sessions are in-process by design. Nothing needs to survive a
# restart, so a disk would cost money and buy nothing.

services:
  - type: web
    name: fermi-podcast-companion
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    # 512 MB is NOT enough. Measured resident set is ~750 MB once the
    # embedding model and the cross-encoder reranker are loaded, so `free`
    # and `starter` will be OOM-killed. `standard` (2 GB) is the smallest
    # instance that runs this reliably.
    plan: standard
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Secrets. Set these in the Render dashboard; never commit them.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Episode audio is streamed from a PRIVATE Cloudflare R2 bucket, so the
      # MP3s stay out of both this repository and the container image while
      # citation click-to-seek keeps working (Range is forwarded to R2).
      - key: AUDIO_BACKEND
        value: s3
      - key: AUDIO_S3_BUCKET
        value: fermi-podcast-audio
      - key: AUDIO_S3_ENDPOINT
        value: https://f49ccb362bf31a5717fa4534e3a7a27b.r2.cloudflarestorage.com
      - key: AUDIO_S3_REGION
        value: auto

      # Providers and models (all already the code defaults; pinned here so
      # the deployment is explicit rather than implicit).
      - key: CHAT_PROVIDER
        value: openrouter
      - key: CHAT_MODEL
        value: anthropic/claude-sonnet-5
      - key: JUDGE_PROVIDER
        value: openrouter
      - key: JUDGE_MODEL
        value: openai/gpt-5-mini

      # Absolute paths matching the image layout.
      - key: DATA_DIR
        value: /app/data
      # Unused while AUDIO_BACKEND=s3 (audio streams from R2 and the image
      # ships an empty audio/). Kept so flipping back to AUDIO_BACKEND=local
      # with a mounted volume works without editing this file.
      - key: AUDIO_DIR
        value: /app/audio
      - key: VECTOR_DB_PATH
        value: /app/data/index

      # Models are baked into the image; never call the Hub at runtime.
      - key: HF_HOME
        value: /opt/hf
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"

      - key: LOG_LEVEL
        value: INFO
