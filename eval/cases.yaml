# Evaluation cases for the Fermi Podcast Companion.
#
# These cases are written against the three supplied Fermi "Great Papers"
# episodes, from this system's own faster-whisper transcripts of the raw MP3s.
# Every `must_retrieve` term below was verified to appear in the real
# transcript text, and every `forbidden_claims` entry was verified NOT to
# appear in any of the three transcripts.
#
# Each case is run through the real production pipeline — the same retriever,
# the same agent, the same prompts. Nothing here is answered by a fixture.
#
# Schema
#   id                 unique identifier
#   category           factual | cross_episode | explanation | recommendation
#                      | locate | refusal | ambiguous | followup
#   input              the learner's message (single-turn cases)
#   turns              list of messages for a multi-turn case; the LAST turn is
#                      the one that is scored
#   expected:
#     episode          episode_id that must appear in the retrieved context
#     episodes         several episode_ids, all of which must appear
#     must_retrieve    terms that should appear in the retrieved passages;
#                      this is the retrieval-quality ground truth and is
#                      checked deterministically, with no LLM involved
#     key_points       what a good answer covers (used by the LLM judge)
#     refusal          true when the correct behaviour is "not covered"
#     clarify_ok       true when asking a clarifying question is acceptable
#   must_cite          answer must carry at least one valid citation
#   forbidden_claims   substrings that must NOT appear — these are true facts
#                      the model knows but the episodes never state, so their
#                      presence is direct evidence of ungrounded generation

cases:

  # ---- factual: answerable from a single episode ----------------------
  - id: factual_01
    category: factual
    input: "What bothered Einstein about the magnet and conductor example?"
    expected:
      episode: "great_papers_01_einstein_s_special_relativity"
      must_retrieve: ["magnet", "asymmetry", "relative motion"]
      key_points:
        - "the same current gets two completely different explanations depending on which object you call moving"
        - "one story is an induced electric field, the other a magnetic force on moving charges"
        - "the asymmetry is in the description, not in nature — only relative motion matters"
    must_cite: true
    forbidden_claims: ["1831", "Lorentz force", "four-vector"]

  - id: factual_02
    category: factual
    input: "What is the lowest match rate a local realist machine can produce in Bell's argument?"
    expected:
      episode: "great_papers_09_bell_s_theorem_1964"
      must_retrieve: ["five-ninths", "56"]
      key_points:
        - "at least five-ninths, about 56%, averaged over all the settings"
        - "that floor follows from counting the eight possible instruction lists"
        - "the real experiment comes in at 50%, under the floor"
    must_cite: true
    forbidden_claims: ["CHSH", "Tsirelson", "2.828"]

  - id: factual_03
    category: factual
    input: "Why did Dirac have to use matrices instead of ordinary numbers?"
    expected:
      episode: "great_papers_12_the_dirac_equation_and_antimatter_1928"
      must_retrieve: ["matrices", "cross terms", "first order"]
      key_points:
        - "he needed to take a square root of the energy-momentum relation"
        - "with ordinary numbers the cross terms cannot cancel, because A times B equals B times A"
        - "matrices do not commute, so the cross terms can be made to cancel"
        - "the smallest matrices that work are 4x4"
    must_cite: true
    forbidden_claims: ["Clifford", "Pauli", "anticommut"]

  - id: factual_04
    category: factual
    input: "At what speed does the relativity episode say gamma reaches 2?"
    expected:
      episode: "great_papers_01_einstein_s_special_relativity"
      must_retrieve: ["gamma", "87"]
      key_points:
        - "at about 87% of the speed of light"
        - "at that speed moving clocks run at half speed"
    must_cite: true
    forbidden_claims: ["0.866", "Lorentz factor"]

  # ---- cross-episode comparison ---------------------------------------
  - id: cross_01
    category: cross_episode
    input: "How do the relativity and Bell episodes each treat the idea that nothing outruns light?"
    expected:
      episodes:
        - "great_papers_01_einstein_s_special_relativity"
        - "great_papers_09_bell_s_theorem_1964"
      must_retrieve: ["faster than light", "speed of light"]
      key_points:
        - "relativity: the limit comes from velocity addition and the diverging energy cost"
        - "Bell: entangled correlations are instant but carry no usable signal, so the limit survives"
        - "the Bell episode explicitly says relativity's speed limit is safe"
    must_cite: true
    forbidden_claims: ["tachyon", "wormhole", "Alcubierre"]

  - id: cross_02
    category: cross_episode
    input: "Compare how these episodes use E = mc squared."
    expected:
      episodes:
        - "great_papers_01_einstein_s_special_relativity"
        - "great_papers_12_the_dirac_equation_and_antimatter_1928"
      must_retrieve: ["mc squared", "annihilate"]
      key_points:
        - "relativity: it is derived in a short September 1905 follow-up, not the main paper"
        - "relativity: emitting energy costs a body mass; mass measures energy content"
        - "Dirac: matter meeting antimatter converts mass entirely into energy — the most literal case"
    must_cite: true
    forbidden_claims: ["nuclear fission", "Hiroshima", "binding energy"]

  - id: cross_03
    category: cross_episode
    input: "Which of these episodes mention CERN, and what is it doing in each?"
    expected:
      episodes:
        - "great_papers_09_bell_s_theorem_1964"
        - "great_papers_12_the_dirac_equation_and_antimatter_1928"
      must_retrieve: ["CERN"]
      key_points:
        - "Bell episode: Bell's day job was designing particle accelerators at CERN in Geneva"
        - "Dirac episode: CERN routinely produces antiprotons and builds anti-hydrogen atoms"
        - "distinguishes the two roles rather than blending them"
    must_cite: true
    forbidden_claims: ["Large Hadron Collider", "1954", "Higgs"]

  # ---- concept explanation --------------------------------------------
  - id: explain_01
    category: explanation
    input: "Explain the twin paradox simply, like I'm new to this."
    expected:
      episode: "great_papers_01_einstein_s_special_relativity"
      must_retrieve: ["twin", "turnaround"]
      key_points:
        - "the travelling twin comes back genuinely younger"
        - "the symmetry breaks because only one of them turns around and feels it"
        - "at the turnaround the traveller's line of simultaneity swings and Earth's clock races forward"
    must_cite: true
    forbidden_claims: ["general relativity solves", "Langevin"]

  - id: explain_02
    category: explanation
    input: "What was the Dirac Sea and why don't physicists use it any more?"
    expected:
      episode: "great_papers_12_the_dirac_equation_and_antimatter_1928"
      must_retrieve: ["Dirac Sea", "negative energy"]
      key_points:
        - "all negative energy states imagined as already filled, so ordinary electrons cannot fall in"
        - "a hole in that sea looks like a positive-energy, positive-charge particle"
        - "Feynman's reading — an antiparticle as a particle moving backward in time — is cleaner and needs no infinite ocean"
    must_cite: true
    forbidden_claims: ["renormalization", "vacuum expectation"]

  # ---- recommendation --------------------------------------------------
  - id: recommend_01
    category: recommendation
    input: "Which episode should I listen to if I want to hear about a prediction that experiment confirmed years later, and why?"
    expected:
      episodes:
        - "great_papers_01_einstein_s_special_relativity"
        - "great_papers_12_the_dirac_equation_and_antimatter_1928"
      must_retrieve: ["predicted", "1932"]
      key_points:
        - "the Dirac episode is the strongest case — the positron was predicted then found in 1932, four years later"
        - "the relativity episode also has confirmations: muons, atomic clocks on airliners"
        - "recommends one and says why, rather than listing everything"
    must_cite: true
    forbidden_claims: ["Nobel Prize in 1921", "photoelectric"]

  # ---- audio location --------------------------------------------------
  - id: locate_01
    category: locate
    input: "Take me to the part where they explain the light clock."
    expected:
      episode: "great_papers_01_einstein_s_special_relativity"
      must_retrieve: ["light clock", "mirrors"]
      key_points:
        - "identifies the passage with two mirrors and a bouncing light pulse"
        - "gives a usable timestamp"
    must_cite: true
    forbidden_claims: []

  - id: locate_02
    category: locate
    input: "Where in the audio do they talk about closing the experimental loopholes?"
    expected:
      episode: "great_papers_09_bell_s_theorem_1964"
      must_retrieve: ["loophole", "Aspect"]
      key_points:
        - "points to the passage on the locality and detection loopholes"
        - "mentions the 2015 loophole-free tests"
        - "gives a usable timestamp"
    must_cite: true
    forbidden_claims: []

  # ---- out-of-scope refusal --------------------------------------------
  - id: refusal_01
    category: refusal
    input: "What is the capital of Australia?"
    expected:
      refusal: true
      key_points: ["states the supplied episodes do not cover this"]
    must_cite: false
    forbidden_claims: ["Canberra", "Sydney", "Melbourne"]

  - id: refusal_02
    category: refusal
    input: "What do these episodes say about how superconductivity works?"
    expected:
      refusal: true
      key_points: ["states the collection does not cover superconductivity"]
    must_cite: false
    forbidden_claims: ["Cooper pair", "BCS", "Meissner", "critical temperature"]

  - id: refusal_03
    category: refusal
    input: "According to these episodes, what is Hawking radiation and how does it make black holes evaporate?"
    expected:
      refusal: true
      key_points: ["states black holes / Hawking radiation are not covered"]
    must_cite: false
    forbidden_claims: ["event horizon", "Hawking", "evaporate", "virtual particle"]

  - id: refusal_04
    category: refusal
    input: "What does the Dirac episode say about the Higgs boson giving particles their mass?"
    expected:
      refusal: true
      key_points:
        - "states the episode does not discuss the Higgs boson"
        - "does not fabricate a Dirac-episode claim about it"
    must_cite: false
    forbidden_claims: ["Higgs field", "Large Hadron Collider", "2012", "boson"]

  # ---- ambiguous --------------------------------------------------------
  - id: ambiguous_01
    category: ambiguous
    input: "What does he mean by spin?"
    expected:
      clarify_ok: true
      episodes:
        - "great_papers_09_bell_s_theorem_1964"
        - "great_papers_12_the_dirac_equation_and_antimatter_1928"
      must_retrieve: ["spin"]
      key_points:
        - "recognises that two episodes use spin differently"
        - "Bell: spin as the up/down measurement outcome that is random and anti-correlated"
        - "Dirac: spin one-half as something forced out of the equation, not assumed"
        - "either asks which is meant, or answers both clearly scoped"
    must_cite: true
    forbidden_claims: ["angular momentum quantum number", "hbar/2"]

  # ---- multi-turn follow-up --------------------------------------------
  - id: followup_01
    category: followup
    turns:
      - "What is the main idea of the relativity episode?"
      - "Explain that bit about changing the stage more simply."
    expected:
      episode: "great_papers_01_einstein_s_special_relativity"
      must_retrieve: ["stage"]
      key_points:
        - "resolves 'that' to the 'he changed the stage, not the light' idea"
        - "others tried to modify light, matter or invent a mechanism"
        - "Einstein kept light's speed fixed and made space and time flexible instead"
    must_cite: true
    forbidden_claims: ["Copenhagen interpretation", "curved spacetime"]

  - id: followup_02
    category: followup
    turns:
      - "Tell me about Bell's inequality."
      - "Does that mean we can send signals faster than light?"
    expected:
      episode: "great_papers_09_bell_s_theorem_1964"
      must_retrieve: ["faster than light", "random"]
      key_points:
        - "no — you cannot send a message, not a bit"
        - "your own outcome is random and uncontrollable, so it carries nothing"
        - "the correlation only shows up when the two result lists are compared over an ordinary channel"
    must_cite: true
    forbidden_claims: ["no-communication theorem", "Bell state"]

  - id: followup_03
    category: followup
    turns:
      - "What did Dirac's equation predict that nobody had seen?"
      - "How long did it take before someone actually found it?"
    expected:
      episode: "great_papers_12_the_dirac_equation_and_antimatter_1928"
      must_retrieve: ["1932", "Anderson"]
      key_points:
        - "four years — the 1928 paper, the positron found in 1932"
        - "Carl Anderson photographing cosmic rays in a cloud chamber"
        - "tracks curved the opposite way, meaning positive charge with the electron's mass"
    must_cite: true
    forbidden_claims: ["Nobel Prize in 1936", "Blackett"]
